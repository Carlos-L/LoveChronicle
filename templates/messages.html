<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - Love Chronicle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>留言板</h1>
    </header>
    <main>
        <div class="messages-container">
            {% for message in messages %}
            <div class="message-card">
                <p class="message-author">{{ message.name }}</p>
                <p class="message-content">{{ message.content }}</p>
            </div>
            {% endfor %}
        </div>
        <form id="message-form" class="message-form">
            <input type="text" id="name" name="name" placeholder="你的名字" required>
            <textarea id="content" name="content" placeholder="写下你的留言..." required></textarea>
            <button type="submit">提交留言</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Love Chronicle</p>
    </footer>
    <script src="{{ url_for('static', filename='js/messages.js') }}"></script>
</body>
</html>
